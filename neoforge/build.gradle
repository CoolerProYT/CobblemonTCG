plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // ./gradlew :neoforge:runClient -PexportArt=<dir>: saves the Cobblemon card renders for the wiki
            // (see docs/README.md), joining the world "wiki-renders" on its own and quitting when done
            if (project.hasProperty('exportArt')) {
                systemProperty('cobblemontcg.exportArt', rootProject.file(project.property('exportArt')).absolutePath)
                programArguments.addAll('--quickPlaySingleplayer', 'wiki-renders')
            }
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    jarJar(implementation("com.coolerpromc.coolerconfig:coolerconfig-neoforge-${minecraft_version}:${cooler_config_version}"))

    // required: this is a Cobblemon addon, see CobblemonCardRenderer and the Cobblemon bridge in compat/
    compileOnly("com.cobblemon:neoforge:${cobblemon_version}") { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    // the dev runs need Cobblemon too, the mod does not load without it
    runtimeOnly("com.cobblemon:neoforge:${cobblemon_version}") { transitive = false }
    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"
}
