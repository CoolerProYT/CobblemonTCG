# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.0.0
group=com.coolerpromc.cobblemontcg
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Cobblemon: TCG
mod_author=CoolerProYT
mod_id=cobblemontcg
license=CC0-1.0
credits=
description=Collect trading cards by opening booster packs.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.116.7+1.21.1
fabric_loader_version=0.18.4

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# CoolerConfig
cooler_config_version=21.1.1

# Cobblemon (required: this is a Cobblemon addon, cards show Cobblemon's Pokemon models and Pokemon rewards give packs)
cobblemon_version=1.8.1+1.21.1
kotlin_version=2.3.0
fabric_kotlin_version=1.13.6+kotlin.2.2.20
kotlin_for_forge_version=5.10.0
# the NeoForge dev runs always include Cobblemon. Set to true to add it to the Fabric dev runs too, which also
# needs -Pfabric_loader_version=0.17.2 -Pfabric_version=0.116.6+1.21.1; Cobblemon's Fabric build does not start
# in a Fabric dev environment (it looks up intermediary class names) and the mod requires Cobblemon, so the
# Fabric dev client does not run either way: test on NeoForge
cobblemon_runtime=false

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
