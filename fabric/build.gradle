plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
    id 'org.jetbrains.kotlin.jvm'
    id 'me.modmuss50.mod-publish-plugin'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation include("com.coolerpromc.coolerconfig:coolerconfig-fabric-${minecraft_version}:${cooler_config_version}")

    modCompileOnly("com.cobblemon:fabric:${cobblemon_version}") { transitive = false }
    modLocalRuntime("com.cobblemon:fabric:${cobblemon_version}")
    modLocalRuntime "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"

    runtimeOnly "org.graalvm.js:js:22.3.0"
    runtimeOnly "org.graalvm.sdk:graal-sdk:22.3.0"
    runtimeOnly "org.graalvm.regex:regex:22.3.0"
    runtimeOnly "org.graalvm.truffle:truffle-api:22.3.0"
    runtimeOnly "com.ibm.icu:icu4j:71.1"
    runtimeOnly "org.mongodb:mongodb-driver-core:4.10.2"
    runtimeOnly "org.mongodb:mongodb-driver-sync:4.10.2"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

publishMods {
    file.set(remapJar.archiveFile)
    type = STABLE
    modLoaders.add("fabric")
    changelog = rootProject.file("changelog.md").text
    displayName = mod_id + "-" + project.version + "+" + minecraft_version + "-fabric"

    curseforge {
        projectId = "1728366"
        accessToken = findProperty("CF_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("cobblemon")
        client=true
        server=true
    }

    modrinth {
        projectId = "G49gRlMM"
        accessToken = findProperty("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("cobblemon")
    }
}