plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation include("com.coolerpromc.coolerconfig:coolerconfig-fabric-${minecraft_version}:${cooler_config_version}")

    // optional integration, see CobblemonCardRenderer and the Cobblemon bridge in compat/
    modCompileOnly("com.cobblemon:fabric:${cobblemon_version}") { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    if (project.findProperty('cobblemon_runtime') == 'true') {
        // needs fabric loader 0.17.2+ and fabric api 0.116.6+; nested jars are not loaded in dev, so add kotlin
        modLocalRuntime("com.cobblemon:fabric:${cobblemon_version}") { transitive = false }
        modLocalRuntime "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}